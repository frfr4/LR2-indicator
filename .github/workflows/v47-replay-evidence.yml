name: Read shared LR2IR archive for chart-level evidence
on:
  push:
    branches: [radar-v47-public-replay-research]
    paths: ['v47-research/**', '.github/workflows/v47-replay-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: |
          v43/clear-v43.tsv
          v47-research
        sparse-checkout-cone-mode: false
    - name: Prepare verified inputs
      run: |
        mkdir -p result
        python -m pip install -q numpy
        python v47-research/ghost_decode.py
    - name: Evaluate documented public chart API on prespecified examples
      run: python v47-research/alternate_sources.py web v47-research/study_md5.txt v43/clear-v43.tsv result
    - name: Collect public difficulty-table activity
      run: python v47-research/bulk_table_activity.py v43/clear-v43.tsv result
    - name: Aggregate public score archive
      run: |
        curl -fLsS --retry 2 --max-time 1200 'https://media.githubusercontent.com/media/MellDa1024/lr2ir-getplayerxml/aa3a8881c6e1d7c58ff3a68d34f7f50ff7a1124f/getplayerxml.tar.gz' -o data.tar.gz
        echo '91483d5e4e2e91945a073e87d5e4fe13a17300399f0a588b061df33fedf32621  data.tar.gz' | sha256sum -c -
        tar xzf data.tar.gz getplayerxml.db
        python v47-research/alternate_sources.py xml getplayerxml.db v43/clear-v43.tsv result
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: OpenLR2-v47-public-IR-chart-evidence
        path: result/
        if-no-files-found: error
        retention-days: 14
