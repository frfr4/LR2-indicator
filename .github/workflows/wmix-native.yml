name: WMIX native indicator
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'OpenLR2 upstream commit or tag'
        default: '09b666a9595d81a1f13126bcf1c1850afa83381b'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GOMazk/OpenLR2
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
      - name: Stage indicator.patch (1)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii indicator.patch.b64 ''
      - shell: python
        run: |
          import gzip, base64, pathlib
          pathlib.Path('indicator.patch').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('indicator.patch.b64').read_bytes())))
      - name: Stage skin.zip (1)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (2)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (3)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (4)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (5)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (6)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (7)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - name: Stage skin.zip (8)
        shell: pwsh
        run: |
          Add-Content -Encoding ascii skin.zip.b64 ''
      - shell: python
        run: |
          import gzip, base64, pathlib
          pathlib.Path('skin.zip').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('skin.zip.b64').read_bytes())))
      - name: Verify and apply source patch
        run: |
          git apply --check --ignore-space-change indicator.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git apply --ignore-space-change indicator.patch
      - name: Configure
        run: cmake --preset windows-vs-x64
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      - name: Build
        run: cmake --build --preset windows-vs-x64-relwithdebinfo
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      - name: Package
        run: |
          Expand-Archive skin.zip stage
          Copy-Item out/windows-vs-x64/RelWithDebInfo/OpenLR2_x64.exe "stage/OpenLR2_indicator Patched.exe"
          Copy-Item dep/FMOD/bin64/fmod.dll stage/
      - uses: actions/upload-artifact@v4
        with:
          name: KCOOL_WMIX_FHD_Native_x64
          path: stage/
          if-no-files-found: error
