name: Audit released v51 difficulty agreement
on:
  push:
    branches: [audit-v51-difficulty-agreement]
    paths: ['.github/workflows/OpenLR2-v51-agreement.yml', 'audit51/**', 'v51/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: inputs/
          key: v51-frozen-hard-inputs-1-${{ matrix.shard }}
      - run: python audit51/measure.py ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: v51-hard-agreement-${{ matrix.shard }}
          path: metrics/

  agreement:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v51-hard-agreement-*
          path: measurement
      - name: Evaluate the frozen Walkure cohort against the current eight axes
        run: python audit51/agreement.py --fresh measurement/*/fresh.tsv --output agreement --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-agreement-results
          path: agreement/
