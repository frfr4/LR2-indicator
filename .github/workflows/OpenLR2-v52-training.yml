name: Measure independent physical training charts
on:
  push:
    branches: [radar-v52-agreement]
    paths: ['.github/workflows/OpenLR2-v52-training.yml', 'v52/training-version']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: inputs/
          key: v52-training-inputs-1-${{ matrix.shard }}
      - run: python v52/measure.py ${{ matrix.shard }} --training
      - uses: actions/upload-artifact@v4
        with:
          name: v52-training-${{ matrix.shard }}
          path: metrics/

