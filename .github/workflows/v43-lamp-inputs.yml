name: Extract LR2IR matched lamp inputs
on:
  push:
    branches: [radar-v43-tech-lamps]
    paths: ['.github/workflows/v43-lamp-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: v42
          persist-credentials: false
      - name: Inspect archived player XML database
        run: |
          curl -fsSL --retry 2 https://media.githubusercontent.com/media/MellDa1024/lr2ir-getplayerxml/HEAD/getplayerxml.tar.gz -o data.tgz
          echo '91483d5e4e2e91945a073e87d5e4fe13a17300399f0a588b061df33fedf32621  data.tgz' | sha256sum -c -
          tar xzf data.tgz getplayerxml.db
          sqlite3 getplayerxml.db '.schema'
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("file:getplayerxml.db?mode=ro",uri=True)
          for name, in db.execute("select name from sqlite_master where type='table'"):
              for row in db.execute("select * from ["+name+"] limit 1"):
                  print(name,[(type(c).__name__,str(c)[:500]) for c in row])
          PY
