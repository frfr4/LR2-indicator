name: Extract LR2IR matched lamp inputs
on:
  push:
    branches: [radar-v43-tech-lamps]
    paths: ['.github/workflows/v43-lamp-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: v42
          persist-credentials: false
      - name: Fetch chart data and inspect backup
        shell: python
        run: |
          import urllib.request, subprocess, pathlib, tarfile, shutil
          subprocess.run(["python","v42/fetch_inputs.py"],check=True)
          p=pathlib.Path("inputs")
          p.mkdir()
          url="https://raw.githubusercontent.com/seraxis/lr2ir-backup/2add57ad8de06b843304b325a16f8bf3475afe09/"+urllib.parse.quote("発狂BMS難易度表.tar.gz")
          urllib.request.urlretrieve(url,p/"insane.tar.gz")
          with tarfile.open(p/"insane.tar.gz") as tar:
              files=[x for x in tar if x.isfile()]
              print(len(files),[(x.name,x.size) for x in files[:4]])
          for name in ["official","bms","star_mapping","attr","hscale","tachi-seed"]:
              shutil.copy("v42/"+name+".json",p)
          shutil.copy("OpenLR2_SelectRadar_Addon.zip",p)
      - uses: actions/upload-artifact@v4
        with:
          name: v43-matched-inputs
          path: inputs/
          retention-days: 14
