name: Extract LR2IR matched lamp inputs
on:
  push:
    branches: [radar-v43-tech-lamps]
    paths: ['.github/workflows/v43-lamp-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: v42
          persist-credentials: false
      - name: Inspect archive sources for observed lamps
        shell: python
        run: |
          from pathlib import Path
          import urllib.request as http, urllib.parse as url, json, tarfile, subprocess
          output=Path("inputs")
          output.mkdir()
          md5="00d6368de4e80cdaf004612699ee03df"
          for key,link in {
            "chart":"https://lr2db.congenial-spirits.com/chart/"+md5,
            "stella":"https://stellaverse.cc/",
            "ia":"https://archive.org/advancedsearch.php?"+url.urlencode({"q":"lr2ir","output":"json","rows":"80","fl[]":"identifier"}),
            "xml":"https://media.githubusercontent.com/media/MellDa1024/lr2ir-getplayerxml/HEAD/getplayerxml.tar.gz",
          }.items():
              try:
                  with http.urlopen(link,timeout=60) as response:
                      if key=="xml":
                          with tarfile.open(fileobj=response,mode="r|gz") as tar:
                              for member in tar:
                                  if member.isfile():
                                      print(member.name,tar.extractfile(member).read(1200));break
                      else:
                          (output/(key+".txt")).write_bytes(response.read(500000))
                  print(key,"OK")
              except Exception as e: print(key,str(e))
          http.urlretrieve("https://raw.githubusercontent.com/seraxis/lr2ir-backup/2add57ad8de06b843304b325a16f8bf3475afe09/lr2ir-userpages-top80k.7z",output/"players.7z")
      - uses: actions/upload-artifact@v4
        with:
          name: v43-public-backup
          path: inputs/
          retention-days: 7
